<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Offer &mdash; DaBirddy Cards</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/jpeg" href="../logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d0d0f; --surface: #17171c; --line: rgba(255,255,255,0.07); --line2: rgba(255,255,255,0.14); --accent: #ff4d6d; --accent2: #ffd166; --accent3: #4ade80; --text: #f0ede8; --muted: #8d8b93; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; min-height: 100vh; padding: 40px 16px 60px; }
    .card { max-width: 520px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 30px 24px; }
    .check { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(74,222,128,0.12); color: var(--accent3); margin-bottom: 16px; }
    .check svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 2px; line-height: 1; }
    .lead { color: #cfccd4; margin-top: 10px; line-height: 1.6; }
    .num { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
    .box { margin-top: 22px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--bg); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 0.92rem; color: #cfccd4; }
    .row b { color: var(--text); }
    .row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-weight: 700; color: var(--text); }
    .muted { color: var(--muted); font-size: 0.8rem; }
    .track { margin-top: 18px; }
    .track h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
    .tn { font-family: ui-monospace, Menlo, monospace; font-size: 1rem; word-break: break-all; color: var(--accent2); }
    .events { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; color: #cfccd4; }
    .events span { color: var(--muted); display: block; font-size: 0.75rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 0.92rem; text-decoration: none; color: var(--text); border: 1px solid var(--line2); background: #202027; white-space: nowrap; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), #e0284b); border: 0; color: #fff; }
    a { color: var(--accent2); }
    .cardrow { display: flex; gap: 14px; align-items: center; margin-top: 20px; }
    .cardrow img { width: 72px; height: 96px; object-fit: contain; border-radius: 8px; background: #1d1d23; flex: none; }
    .cardrow .t { font-weight: 700; line-height: 1.3; }
    .cardrow .s { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
    .pill { display: inline-block; margin-top: 14px; padding: 5px 11px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(255,255,255,0.08); color: var(--muted); }
    .pill.good { background: rgba(74,222,128,0.14); color: var(--accent3); }
    .pill.wait { background: rgba(255,209,102,0.14); color: var(--accent2); }
    .pill.bad { background: rgba(255,77,109,0.14); color: #ff8fa3; }
    .err { color: #ff8fa3; font-size: 0.88rem; margin-top: 12px; }
    .err:empty { display: none; }
    button.btn { cursor: pointer; font: inherit; font-weight: 700; }
    button.btn:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <main class="card" id="main">
    <h1>Your offer</h1>
    <p class="lead" id="lead">Loading…</p>
  </main>

<script>
var SHOP_API = 'https://fbxrizapfpjyvhxwyweb.supabase.co/functions/v1';
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function money(cents) { var d = cents % 100 ? 2 : 0; return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function when(iso) { var d = new Date(iso); return d.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }

  var token = (location.search.match(/[?&]o=([0-9a-f]{64})/) || [])[1];
  if (!token) { $('lead').textContent = 'This offer link isn’t complete. Check the link you were sent.'; return; }

  fetch(SHOP_API + '/card-offer?o=' + token, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (o) { if (o) render(o); else $('lead').textContent = 'We couldn’t find this offer. Check the link you were sent.'; })
    .catch(function () { $('lead').textContent = 'Couldn’t load your offer. Check your connection and refresh.'; });

  function render(o) {
    var c = o.card, cardLink = c ? './#' + c.id : './';
    var pill, lead, actions = '';
    var sold = c && !c.available && o.status !== 'paid';
    if (o.status === 'pending') { pill = '<span class="pill wait">Waiting for a reply</span>'; lead = 'You offered <b>' + money(o.offer) + '</b>. We’ll reply by email, usually within a day.'; }
    else if (o.status === 'accepted') { pill = '<span class="pill good">Accepted</span>'; lead = 'Your offer of <b>' + money(o.offer) + '</b> was accepted. Pay by ' + when(o.expires_at) + ' to get it.'; }
    else if (o.status === 'countered') { pill = '<span class="pill wait">Counter offer</span>'; lead = 'You offered ' + money(o.offer) + '. We can do <b>' + money(o.counter) + '</b>. Pay by ' + when(o.expires_at) + ' to get it.'; }
    else if (o.status === 'declined') { pill = '<span class="pill bad">Declined</span>'; lead = 'We can’t take ' + money(o.offer) + ' for this one. You can still buy it at the listed price, or make a different offer.'; }
    else if (o.status === 'expired') { pill = '<span class="pill bad">Expired</span>'; lead = 'The 48 hours to pay for this offer ran out. Make a new offer or buy it at the listed price.'; }
    else if (o.status === 'paid') { pill = '<span class="pill good">Paid</span>'; lead = 'Thanks! Your order is in. Check your email for the Stripe receipt.'; }
    else { pill = '<span class="pill">Closed</span>'; lead = 'This offer is closed.'; }
    if (sold) { pill = '<span class="pill bad">Sold</span>'; lead = 'Sorry, this card sold before your offer could go through.'; }

    if (!sold && o.pay && (o.status === 'accepted' || o.status === 'countered')) {
      actions = '<button class="btn primary" id="payBtn">Pay ' + money(o.pay) + ' + shipping</button>' +
        '<button class="btn" id="cartBtn">Add to cart</button>';
    } else if (!sold && c && o.status !== 'paid' && o.status !== 'pending') {
      actions = '<a class="btn primary" href="' + esc(cardLink) + '">See the card</a>';
    }
    actions += '<a class="btn" href="./">Shop more cards</a>';
    var canCart = /cartBtn/.test(actions);

    $('main').innerHTML = '<h1>Your offer</h1>' + pill +
      (c ? '<div class="cardrow">' + (c.photo ? '<img src="' + esc(c.photo) + '" alt="">' : '') + '<div><div class="t">' + esc(c.title) + '</div><div class="s">' +
        esc([c.variant, c.set, c.number ? '#' + c.number : null].filter(Boolean).join(' · ')) + (c.variant || c.set || c.number ? ' · ' : '') + 'Listed at ' + money(c.price) + '</div></div></div>' : '') +
      '<p class="lead">' + lead + '</p><p class="err" id="err"></p><div class="actions">' + actions + '</div>' +
      (canCart ? '<p class="muted" style="margin-top:12px">Want more cards in the same box? Add this one to your cart at ' + money(o.pay) + ', keep shopping, and check out once.</p>' : '') +
      '<p class="muted" style="margin-top:16px">Bookmark this page to check on your offer. Questions? <a href="https://ig.me/m/dabirddygaming" target="_blank" rel="noopener">Message us</a>.</p>';

    var add = $('cartBtn');
    if (add) add.addEventListener('click', function () {
      var key = 'dabirddy_cards_cart_v1', cart = [];
      try { cart = JSON.parse(localStorage.getItem(key) || '[]'); if (!Array.isArray(cart)) cart = []; } catch (e) {}
      cart = cart.filter(function (l) { return l && l.id !== c.id; });
      cart.push({ id: c.id, qty: 1, offer: token, price: o.pay, exp: o.expires_at });
      try { localStorage.setItem(key, JSON.stringify(cart)); } catch (e) { $('err').textContent = 'Your browser blocked the cart. Use Pay instead.'; return; }
      location.href = './?cart=1';
    });

    var pay = $('payBtn');
    if (pay) pay.addEventListener('click', function () {
      pay.disabled = true; pay.textContent = 'Starting checkout…';
      var last = null; try { last = localStorage.getItem('dabirddy_cards_last_order'); } catch (e) {}
      fetch(SHOP_API + '/card-checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ offer: token, release: last || undefined }) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (x) {
          if (x.ok && x.d.url) { try { localStorage.setItem('dabirddy_cards_last_order', x.d.order); } catch (e) {} location.href = x.d.url; return; }
          $('err').textContent = x.d.error || 'Checkout didn’t start. Please try again.';
          pay.disabled = false; pay.textContent = 'Pay ' + money(o.pay) + ' + shipping';
        })
        .catch(function () { $('err').textContent = 'Checkout didn’t start. Check your connection and try again.'; pay.disabled = false; pay.textContent = 'Pay ' + money(o.pay) + ' + shipping'; });
    });
  }
})();
</script>
</body>
</html>
