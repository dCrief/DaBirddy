<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Track Your Order &mdash; DaBirddy Cards</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/jpeg" href="../logo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root { --bg: #0d0d0f; --surface: #17171c; --line: rgba(255,255,255,0.07); --line2: rgba(255,255,255,0.14); --accent: #ff4d6d; --accent2: #ffd166; --accent3: #4ade80; --text: #f0ede8; --muted: #8d8b93; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; min-height: 100vh; padding: 40px 16px 60px; }
    .card { max-width: 520px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 30px 24px; }
    .check { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(74,222,128,0.12); color: var(--accent3); margin-bottom: 16px; }
    .check svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; letter-spacing: 2px; line-height: 1; }
    .lead { color: #cfccd4; margin-top: 10px; line-height: 1.6; }
    .num { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
    .box { margin-top: 22px; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--bg); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 0.92rem; color: #cfccd4; }
    .row b { color: var(--text); }
    .row.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; font-weight: 700; color: var(--text); }
    .muted { color: var(--muted); font-size: 0.8rem; }
    .track { margin-top: 18px; }
    .track h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
    .tn { font-family: ui-monospace, Menlo, monospace; font-size: 1rem; word-break: break-all; color: var(--accent2); }
    .events { list-style: none; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; color: #cfccd4; }
    .events span { color: var(--muted); display: block; font-size: 0.75rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 0.92rem; text-decoration: none; color: var(--text); border: 1px solid var(--line2); background: #202027; white-space: nowrap; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), #e0284b); border: 0; color: #fff; }
    a { color: var(--accent2); }
    form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    input { font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line2); border-radius: 10px; padding: 11px 12px; width: 100%; text-transform: none; letter-spacing: 0; font-weight: 400; }
    form .btn { flex: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; }
    .err { color: #ff8fa3; font-size: 0.88rem; }
    .err:empty { display: none; }
    .status { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; background: rgba(255,209,102,0.12); color: var(--accent2); }
    .status.shipped { background: rgba(74,222,128,0.12); color: var(--accent3); }
    .review-cta { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: rgba(255,209,102,0.08); border: 1px solid rgba(255,209,102,0.25); font-size: 0.9rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Track your order</h1>
    <p class="lead" id="lead">Enter your order number (it starts with DB and is in your confirmation email) and the email you used at checkout.</p>
    <p class="num" id="num"></p>
    <form id="find" novalidate>
      <label>Order number<input id="fOrder" placeholder="DB1A2B3C4D" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
      <label>Email<input id="fEmail" type="email" autocomplete="email" placeholder="you@email.com"></label>
      <p class="err" id="fErr"></p>
      <button class="btn primary" id="fBtn" type="submit">Find my order</button>
    </form>
    <div id="details"></div>
    <div class="actions">
      <a class="btn primary" href="./">Keep shopping</a>
      <a class="btn" href="https://ig.me/m/dabirddygaming" target="_blank" rel="noopener">Questions? Message us</a>
    </div>
  </main>
  <footer id="siteFooter"></footer>
<script src="site.js"></script>
<script>
var SHOP_API = 'https://fbxrizapfpjyvhxwyweb.supabase.co/functions/v1';
(function () {
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function money(cents) { var d = cents % 100 ? 2 : 0; return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }

  window.DaBirddy && DaBirddy.track('view');
  var q = new URLSearchParams(location.search);
  var sid = q.get('session_id');
  // Links from our emails: ?session_id=… opens the order straight away; ?o=DB… fills in the number.
  if (q.get('o')) $('fOrder').value = q.get('o');
  if (sid) { $('find').hidden = true; $('lead').textContent = 'Loading your order…'; load('session_id=' + encodeURIComponent(sid)); }

  $('find').addEventListener('submit', function (e) {
    e.preventDefault();
    var num = $('fOrder').value.trim().toUpperCase().replace(/^#/, ''), email = $('fEmail').value.trim();
    if (!/^DB[0-9A-F]{6,12}$/.test(num)) { $('fErr').textContent = 'Order numbers start with DB, like DB1A2B3C4D.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { $('fErr').textContent = 'Enter the email you used at checkout.'; return; }
    $('fErr').textContent = ''; $('fBtn').disabled = true; $('fBtn').textContent = 'Looking…';
    load('order=' + encodeURIComponent(num) + '&email=' + encodeURIComponent(email), true);
  });

  function load(query, fromForm) {
    fetch(SHOP_API + '/card-order?' + query, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        $('fBtn').disabled = false; $('fBtn').textContent = 'Find my order';
        if (!o) {
          if (fromForm) $('fErr').textContent = 'We couldn’t find that order. Check the number and the email, or email dabirddy@gmail.com.';
          else { $('find').hidden = false; $('lead').textContent = 'We couldn’t open that order link. Look it up with your order number and email instead.'; }
          return;
        }
        $('find').hidden = true;
        $('lead').textContent = o.shipped ? 'Your order is on its way.' : 'We’re getting your order ready to ship. We usually ship within 1–2 business days.';
        render(o);
      })
      .catch(function () { $('fBtn').disabled = false; $('fBtn').textContent = 'Find my order'; $('fErr').textContent = 'Couldn’t reach us. Check your connection and try again.'; });
  }

  function render(o) {
    $('num').innerHTML = 'Order ' + esc(o.order) + '<br><span class="status' + (o.shipped ? ' shipped' : '') + '">' + (o.status === 'cancelled' ? 'Cancelled' : o.shipped ? 'Shipped' : 'Getting ready to ship') + '</span>';
    var rows = o.items.map(function (it) {
      var sub = [it.set, it.number ? '#' + it.number : null].filter(Boolean).join(' · ');
      return '<div class="row"><span><b>' + esc(it.title) + '</b>' + (it.qty > 1 ? ' × ' + it.qty : '') + (sub ? '<br><span class="muted">' + esc(sub) + '</span>' : '') + '</span><span>' + money(it.price * it.qty) + '</span></div>';
    }).join('');
    var how = o.method === 'envelope' ? 'Tracked envelope' : 'Tracked package (USPS)';
    var html = '<div class="box">' + rows +
      '<div class="row"><span>' + how + '</span><span>' + money(o.shipping) + '</span></div>' +
      '<div class="row total"><span>Total</span><span>' + money(o.total != null ? o.total : o.subtotal + o.shipping) + '</span></div></div>';
    if (o.tracking) {
      html += '<div class="track"><h2>Tracking</h2><div class="tn">' + esc(o.tracking) + '</div>' +
        '<p class="muted" style="margin-top:6px">' + (o.shipped ? 'On its way.' : 'Your label is ready. Tracking updates start once it’s in the mail, usually within 1–2 business days.') + '</p>' +
        (o.trackUrl ? '<p style="margin-top:8px"><a href="' + esc(o.trackUrl) + '" target="_blank" rel="noopener">Track on USPS.com</a></p>' : '');
      if (o.progress && o.progress.events && o.progress.events.length) {
        html += '<ul class="events">' + o.progress.events.map(function (e) { return '<li>' + esc(e.description) + '<span>' + esc(e.date) + '</span></li>'; }).join('') + '</ul>';
      }
      html += '</div>';
    } else if (o.status !== 'cancelled') {
      html += '<p class="muted" style="margin-top:14px">Your tracking number will appear here once your label is made.</p>';
    }
    if (o.reviewUrl) html += '<div class="review-cta">Got your cards? <a href="' + esc(o.reviewUrl) + '"><b>Leave a review</b></a>. It really helps a small shop.</div>';
    html += '<p class="muted" style="margin-top:14px">Something wrong? Reply to any of our emails or write to <a href="mailto:dabirddy@gmail.com">dabirddy@gmail.com</a>. Cards can be returned within 14 days of delivery; sealed product is final sale (<a href="policies.html#returns">how returns work</a>).</p>';
    $('details').innerHTML = html;
  }

  load();
})();
</script>
</body>
</html>
